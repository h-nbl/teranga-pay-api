spring:
  application:
    name: teranga-pay-api
  config:
    # Lit le fichier .env à la racine du projet s'il existe (sinon, on l'ignore).
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5433}/${DB_NAME:terangapay}
    username: ${DB_USER:terangapay}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 30